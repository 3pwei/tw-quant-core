[project]
name = "tw-quant-core"
version = "0.1.0"
description = "Broker-neutral quantitative trading core"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tw_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
