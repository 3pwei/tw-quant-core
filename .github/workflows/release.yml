name: Release artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/tw-quant-core-release-smoke
          /tmp/tw-quant-core-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/tw-quant-core-release-smoke/bin/python -c "import tw_quant_core; assert tw_quant_core.__version__ == '1.1.0'"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tw-quant-core-${{ github.ref_name }}
          path: dist/
